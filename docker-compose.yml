# 배포 뷰 (아키텍처 7장)
#
# 공개 포트는 frontend · backend만 둔다. agent와 MCP 서버는 ports를 주지 않아서
# 브라우저에서 닿지 않고, compose 내부망에서 **서비스 이름**으로만 불린다
# (예: http://business-mcp:9101/mcp). 교재 5장 "브라우저에 노출되는 주소를 줄인다".
#
# 시작 순서를 거의 신경 쓰지 않는 이유: 서비스끼리는 실제로 호출할 때 연결하기
# 때문이다. agent가 먼저 떠도 MCP 서버가 준비되면 그때부터 정상 동작한다.
# → 그래서 healthcheck가 아직 없다. (아키텍처 7장 표에는 서비스마다 있다)
#
# 아직 없는 것: indexer, rabbitmq(P2) — 담당자가 추가
# 설계 배경: docs/walking-skeleton.md
services:
  frontend:
    build:
      context: ./frontend
      # 실제 API로 화면을 띄운다 (Dockerfile 기본값은 목데이터 mock). 목데이터로 보려면 .env에 VITE_DATA_MODE=mock
      args:
        VITE_DATA_MODE: ${VITE_DATA_MODE:-api}
    ports: ["3000:80"]        # 공개. 브라우저가 여기로 들어온다
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8080:8080"]      # 공개. 화면이 /api/**로 부른다
    environment:
      AGENT_URL: http://agent:8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bom
      SPRING_DATASOURCE_USERNAME: app        # public 스키마만 쓸 수 있는 계정 (db/init.sql)
      SPRING_DATASOURCE_PASSWORD: app
      # JWT 서명 키. 기본값은 내부망 시연용이다. 밖에 띄우면 .env에서 32바이트 이상 새 값으로 바꾼다
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes}
    depends_on:
      postgres: { condition: service_healthy }   # DB가 받을 준비가 된 뒤에 뜬다

  agent:
    build: ./agent
    # 포트 없음 = 내부 전용. backend만 부른다
    environment:
      BACKEND_URL: http://backend:8080
      BUSINESS_MCP_URL: http://business-mcp:9101/mcp   # /mcp 빠뜨리면 404
      RAG_MCP_URL: http://rag-mcp:9102/mcp
      # 키가 비어 있으면 agent가 가짜 모델로 돈다. 키는 .env에만 두고 커밋하지 않는다
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # checkpointer: 승인 대기 상태를 agent 스키마에 저장 (agent 계정은 자기 스키마만, db/init.sql)
      AGENT_DB_URL: postgresql://agent:agent@postgres:5432/bom
    depends_on:
      business-mcp: { condition: service_started }
      rag-mcp: { condition: service_started }
      postgres: { condition: service_healthy }

  business-mcp:
    build: ./business-mcp
    # 포트 없음 = 내부 전용. agent만 MCP로 부른다
    environment:
      BACKEND_URL: http://backend:8080   # 업무 데이터는 전부 backend를 거친다

  rag-mcp:
    build: ./rag-mcp
    # 포트 없음 = 내부 전용

  postgres:
    # pgvector가 들어 있는 이미지. 업무 DB와 벡터 DB를 하나로 쓴다 (contracts.md 5 "Vector DB")
    image: pgvector/pgvector:pg16
    # 포트 없음 = 내부 전용. 확인할 때는 docker compose exec postgres psql -U app bom
    environment:
      POSTGRES_DB: bom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}   # 관리자 계정. 서비스는 app/agent/rag 계정을 쓴다
    volumes:
      # init.sql(계정) → schema.sql(테이블) → seed.sql(시연 데이터). 이름 순서로 돌고, 빈 볼륨일 때만 돈다
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data   # 재시작해도 작업·승인 기록이 남게. 초기화는 down -v
    healthcheck:
      # 다른 서비스가 DB를 쓰기 시작하면 depends_on: condition: service_healthy로 기다린다
      test: ["CMD-SHELL", "pg_isready -U postgres -d bom"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
