# 화면을 서빙하고, /api/** 는 backend로 넘긴다.
# 브라우저가 backend를 직접 부르지 않아도 되게 해서 CORS 설정을 없앴다.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;

        # SSE는 이 두 줄이 핵심이다.
        # proxy_buffering을 끄지 않으면 nginx가 이벤트를 모아 뒀다가 한꺼번에
        # 보내서, 화면에 진행 상황이 실시간으로 안 보인다.
        proxy_buffering off;
        # 작업 전체 제한이 120초라, 그보다 조금 길게 잡는다 (아키텍처 4.2)
        proxy_read_timeout 130s;
    }
}
