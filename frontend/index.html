<!doctype html>
<!--
  frontend — Presentation 계층 (아키텍처 3장)

  금지 (교재 5장)
    - 권한 판단 금지. 역할에 따라 버튼을 보여 주거나 숨기기만 하고,
      "할 수 있는가"는 backend가 정한다.
    - AI 서버(agent) 직접 호출 금지. 화면은 /api/** 만 부른다.
      실제로 agent는 compose에서 포트를 공개하지 않아 브라우저에서 닿지도 않는다.

  지금은 뼈대라 CDN Vue 한 장이다. 아키텍처·교재 기준은 Vue 3 + Vite 이고,
  프론트 담당이 전환한다. 그때 필요한 화면:
    로그인 / 질문 입력 / 영향 분석 결과 표 / 대안 비교 카드 /
    승인 카드(도구·인자·금액) / 근거 패널 / 작업 이력

  설계 배경: docs/walking-skeleton.md
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>BOM Agent</title>
  <!-- ponytail: Vite 없이 CDN Vue. 화면이 커지면 프론트 담당이 Vite 프로젝트로 전환 -->
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app">
  <h1>BOM Agent</h1>
  <!-- 로그인: backend 6단계(JWT)가 붙으면서 /api/**가 로그인 필수가 돼, 흐름이 끊기지 않게
       Backend 파트가 최소한으로 넣었다. 실제 로그인 화면은 프론트 담당이 만든다 (contracts.md 3.1).
       시연 계정 3개를 버튼으로 둔다. 비밀번호는 seed의 시연값 1234 -->
  <p>
    <button v-for="u in ['planner', 'buyer', 'approver']" :key="u" @click="login(u)"
            :style="{ fontWeight: user && user.user_id === u ? 'bold' : 'normal' }">{{ u }}</button>
    <span v-if="user">{{ user.name }} ({{ user.role }})로 로그인</span>
  </p>
  <form v-if="user" @submit.prevent="ask">
    <input v-model="question" size="50">
    <button :disabled="running">질문</button>
  </form>
  <p v-if="taskId">taskId: {{ taskId }}</p>

  <!-- 받은 이벤트를 순서대로 쌓아 보여 준다. 실제 화면에서는 종류별로
       다른 영역에 그린다: TOKEN은 답변 영역에 이어 붙이고, TOOL_*은 진행
       상태 줄에, APPROVAL_REQUIRED는 승인 카드로 (아키텍처 9.3). -->
  <ul>
    <li v-for="e in events" :key="e.seq">
      <b>{{ e.type }}</b> {{ e.tool || '' }}
      <span v-if="e.type === 'TOOL_END'">({{ e.ok ? 'ok' : '실패' }}, {{ e.ms }}ms)</span>
      <pre v-if="e.answer">{{ e.answer }}</pre>
      <pre v-if="e.sources">근거: {{ e.sources }}</pre>
      <pre v-if="e.message">{{ e.message }}</pre>
    </li>
  </ul>
</div>
<script>
Vue.createApp({
  data: () => ({ question: '허브를 11/25로 당기면?', taskId: null, events: [], running: false, user: null }),
  methods: {
    async login(userId) {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, password: '1234' }),
      })
      // 응답: { token, user_id, name, role, expires_at }. role은 버튼 표시에만 쓴다. 권한 판단은 backend가 한다
      this.user = await res.json()
    },
    async ask() {
      this.events = []
      this.running = true

      // ① 질문을 작업으로 접수한다. 답변을 기다리지 않고 taskId만 바로 받는다.
      const res = await fetch('/api/ai/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${this.user.token}` },
        body: JSON.stringify({ question: this.question }),
      })
      this.taskId = (await res.json()).taskId

      // ⑦ 받은 taskId로 진행 이벤트를 구독한다.
      //    구독하기까지 몇 ms 사이에 이미 나온 이벤트는 backend가 처음부터
      //    다시 보내 주므로 놓치지 않는다 (BackendApplication.stream 참고).
      //    EventSource는 헤더를 못 붙여서 토큰을 주소에 싣는다. backend가 이 경로에서만 받아 준다
      const es = new EventSource(`/api/ai/tasks/${this.taskId}/stream?access_token=${this.user.token}`)
      es.onmessage = (m) => {
        const e = JSON.parse(m.data)
        this.events.push(e)
        // DONE·FAILED가 오면 그 작업은 끝이다. 안 닫으면 브라우저가 계속 재연결한다.
        if (e.type === 'DONE' || e.type === 'FAILED') { es.close(); this.running = false }
      }
    },
  },
}).mount('#app')
</script>
</body>
</html>
